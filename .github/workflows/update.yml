name: Update mimalloc

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 3.5.5 (also used to rebuild an existing version). Leave empty to auto-detect.
        required: false
        type: string
      upstream_tag:
        description: Upstream tag to build, for example v3.5.4. Leave empty to detect.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-mimalloc
  cancel-in-progress: false

env:
  UPSTREAM_REPO: microsoft/mimalloc
  PACKAGE_NAME: mimalloc-windows-x64.zip

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check for a new mimalloc release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCED_VERSION: ${{ inputs.version }}
          FORCED_UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python scripts/check_update.py

      - name: Checkout mimalloc
        if: steps.check.outputs.has_update == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.check.outputs.upstream_ref }}
          path: upstream

      - name: Build mimalloc (windows x64)
        if: steps.check.outputs.has_update == 'true'
        env:
          CL: /Zi
          LINK: /DEBUG /OPT:REF /OPT:ICF
        run: |
          cmake -S upstream -B upstream/build -A x64 -DCMAKE_BUILD_TYPE=Release -DMI_BUILD_TESTS=OFF
          cmake --build upstream/build --config Release

      - name: Install Python dependencies
        if: steps.check.outputs.has_update == 'true'
        run: python -m pip install --disable-pip-version-check pefile

      - name: Package release archive
        if: steps.check.outputs.has_update == 'true'
        run: python scripts/package.py --build-dir upstream/build --version ${{ steps.check.outputs.version }} --output ${{ env.PACKAGE_NAME }}

      - name: Bump tooth.json
        if: steps.check.outputs.has_update == 'true'
        run: python scripts/update_tooth.py ${{ steps.check.outputs.version }} --upstream ${{ steps.check.outputs.upstream_ref }}

      - name: Commit tooth.json and upstream.json
        id: commit
        if: steps.check.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooth.json upstream.json
          git diff --cached --quiet || git commit -m "chore: bump mimalloc to ${{ steps.check.outputs.version }}"
          git push
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$(git rev-parse HEAD)"

      - name: Remove existing release ${{ steps.check.outputs.tag }}
        if: steps.check.outputs.has_update == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete ${{ steps.check.outputs.tag }} --yes

      - name: Publish release ${{ steps.check.outputs.tag }}
        if: steps.check.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: mimalloc ${{ steps.check.outputs.tag }}
          body: |
            Automated Windows x64 build of upstream mimalloc `${{ steps.check.outputs.upstream_ref }}`, released as `${{ steps.check.outputs.tag }}`.
          files: ${{ env.PACKAGE_NAME }}
